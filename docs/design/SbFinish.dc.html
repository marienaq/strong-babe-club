<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finish workout (scrapbook)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes slap{0%{opacity:0;transform:scale(2.2) rotate(var(--r))}55%{opacity:1;transform:scale(0.9) rotate(var(--r))}100%{opacity:1;transform:scale(1) rotate(var(--r))}}
@keyframes twinkle{0%,100%{transform:scale(0.6);opacity:0.4}50%{transform:scale(1.15);opacity:1}}
@keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes jiggle{0%,76%,100%{transform:rotate(-1deg)}80%{transform:rotate(-4deg) scale(1.03)}84%{transform:rotate(2.5deg) scale(1.03)}88%{transform:rotate(-2.5deg)}92%{transform:rotate(0deg)}}
.sb-slap{animation:slap .55s cubic-bezier(.2,1.2,.4,1) both}
.sb-twinkle{animation:twinkle 1.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.sb-draw{stroke-dasharray:300;animation:draw .8s ease-out 1s both}
.sb-go{animation:jiggle 3s ease-in-out 2.5s infinite}
.sb-sticker{filter:drop-shadow(0 3px 3px rgba(43,27,61,0.22))}
@media (prefers-reduced-motion: reduce){.sb-slap,.sb-twinkle,.sb-draw,.sb-go{animation:none;stroke-dasharray:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background-color:#FFF8EE;background-image:radial-gradient(#E8D9C8 1.2px, transparent 1.2px);background-size:18px 18px;color:#2B1B3D;font-family:'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;gap:11px;padding:48px 20px 28px 44px;overflow:hidden">
  <div style="position:absolute;left:30px;top:0;bottom:0;width:2px;background:#FFC4D6"></div>

  <div style="position:relative;display:flex;flex-direction:column">
    <span style="font-family:'Caveat',cursive;font-size:21px;font-weight:600;color:#6E5F7E">Mon, Oct 5 · 52 min · streak is now 10</span>
    <h1 style="margin:0;font-size:32px;font-weight:800;line-height:1.05">you did it!</h1>
  </div>

  <section style="position:relative;background:#FFFFFF;padding:12px 10px 10px;transform:rotate(-0.6deg);box-shadow:0 3px 8px rgba(43,27,61,0.08);display:flex;flex-direction:column;gap:8px">
    <span style="position:absolute;left:50%;top:-9px;margin-left:-32px;width:64px;height:18px;background:repeating-linear-gradient(45deg,#FFC94D 0 6px,#FFD978 6px 12px);opacity:0.85;transform:rotate(-3deg)"></span>
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px">
      <span style="font-family:'Caveat',cursive;font-size:23px;font-weight:700">pick today's sticker</span>
      <span style="font-family:'Caveat',cursive;font-size:18px;font-weight:700;color:#B3265E">{{pickedLabel}}</span>
    </div>
    <div role="radiogroup" aria-label="Choose a sticker" style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;justify-items:center;align-items:center;height:64px">
      <sc-for list="{{stickers}}" as="k" hint-placeholder-count="6">
        <button role="radio" aria-checked="{{k.on}}" aria-label="{{k.name}}" onClick="{{k.pick}}" class="sb-sticker" style="position:relative;width:{{k.size}};height:{{k.size}};padding:0;border-radius:50%;border:3px solid #FFFFFF;background:{{k.bg}};box-sizing:border-box;display:flex;align-items:center;justify-content:center;transform:rotate({{k.rot}});transition:all .25s cubic-bezier(.2,1.4,.4,1);opacity:{{k.op}}">
          <sc-if value="{{k.barbell}}" hint-placeholder-val="{{ false }}"><svg width="28" height="15" viewBox="0 0 54 28" aria-hidden="true"><rect x="2" y="12" width="50" height="4" rx="2" fill="#2B1B3D"></rect><rect x="9" y="3" width="7" height="22" rx="3.5" fill="#FFF4E8"></rect><rect x="38" y="3" width="7" height="22" rx="3.5" fill="#FFF4E8"></rect></svg></sc-if>
          <sc-if value="{{k.kettle}}" hint-placeholder-val="{{ false }}"><svg width="24" height="26" viewBox="0 0 56 58" aria-hidden="true"><path d="M17 22C17 7 39 7 39 22" fill="none" stroke="#2B1B3D" stroke-width="6" stroke-linecap="round"></path><circle cx="28" cy="37" r="19" fill="#FFF4E8"></circle><circle cx="22" cy="36" r="3" fill="#2B1B3D"></circle><circle cx="34" cy="36" r="3" fill="#2B1B3D"></circle><path d="M24 43Q28 47 32 43" fill="none" stroke="#2B1B3D" stroke-width="2.5" stroke-linecap="round"></path></svg></sc-if>
          <sc-if value="{{k.dumbbell}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(-35 12 12)"><rect x="4" y="11" width="16" height="2.4" rx="1.2" fill="#2B1B3D"></rect><rect x="3" y="7.5" width="4" height="9" rx="1.6" fill="#FFF4E8"></rect><rect x="17" y="7.5" width="4" height="9" rx="1.6" fill="#FFF4E8"></rect></g></svg></sc-if>
          <sc-if value="{{k.bear}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><circle cx="11" cy="11" r="5" fill="#FFF4E8" stroke="#2B1B3D" stroke-width="2.5"></circle><circle cx="29" cy="11" r="5" fill="#FFF4E8" stroke="#2B1B3D" stroke-width="2.5"></circle><circle cx="20" cy="22" r="13" fill="#FFF4E8" stroke="#2B1B3D" stroke-width="2.5"></circle><circle cx="15" cy="20" r="1.8" fill="#2B1B3D"></circle><circle cx="25" cy="20" r="1.8" fill="#2B1B3D"></circle><ellipse cx="20" cy="27" rx="4.5" ry="3.2" fill="#FFF4E8" stroke="#2B1B3D" stroke-width="2"></ellipse><circle cx="20" cy="26" r="1.4" fill="#2B1B3D"></circle></svg></sc-if>
          <sc-if value="{{k.flame}}" hint-placeholder-val="{{ false }}"><svg width="22" height="26" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1c1.5 5 7 7.5 7 14a7 7 0 0 1-14 0c0-4 2.5-5.5 2.5-9.5 2.5 1.5 4 4 4 7" fill="#FF6B3D" stroke="#2B1B3D" stroke-width="1.8" stroke-linejoin="round"></path><path d="M12 25a3.5 3.5 0 0 1-3.5-3.5c0-2 2-3 3.5-6 1.5 3 3.5 4 3.5 6A3.5 3.5 0 0 1 12 25z" fill="#FFC94D"></path></svg></sc-if>
          <sc-if value="{{k.star}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.8 6 6.5.6-4.9 4.4 1.5 6.4L12 16.6 6.1 19.9l1.5-6.4L2.7 9.1l6.5-.6z" fill="#FFF4E8" stroke="#2B1B3D" stroke-width="1.6" stroke-linejoin="round"></path></svg></sc-if>
          <sc-if value="{{k.rare}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-12px;right:-14px;background:#B3265E;color:#FFFFFF;font-size:9px;font-weight:800;border-radius:8px;padding:2px 5px;transform:rotate(12deg);white-space:nowrap">PR only</span></sc-if>
        </button>
      </sc-for>
    </div>
  </section>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
    <section style="position:relative;background:#FFFFFF;padding:14px 12px 10px;transform:rotate(-1.5deg);box-shadow:0 3px 8px rgba(43,27,61,0.08);display:flex;flex-direction:column;gap:2px">
      <span style="position:absolute;left:12px;top:-9px;width:52px;height:18px;background:repeating-linear-gradient(45deg,#FF6B3D 0 6px,#FF8D66 6px 12px);opacity:0.85;transform:rotate(-4deg)"></span>
      <span style="font-family:'Caveat',cursive;font-size:20px;font-weight:700;color:#C2410C">strength</span>
      <span style="font-size:13px;font-weight:700;color:#6E5F7E">top set</span>
      <span style="font-size:24px;font-weight:800;line-height:1.1">125 lb</span>
      <span style="font-size:13px;font-weight:700;color:#6E5F7E;margin-top:4px">total lifted</span>
      <span style="font-size:20px;font-weight:800;line-height:1.1">2,925 lb</span>
      <span class="sb-slap sb-sticker" style="--r:12deg;position:absolute;right:-12px;top:22px;width:50px;height:50px;border-radius:12px 25px 12px 25px;background:#3CC8A5;border:3px solid #FFFFFF;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1;animation-delay:.9s"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.8 6 6.5.6-4.9 4.4 1.5 6.4L12 16.6 6.1 19.9l1.5-6.4L2.7 9.1l6.5-.6z" fill="#FFF4E8" stroke="#2B1B3D" stroke-width="1.6" stroke-linejoin="round"></path></svg>PR!</span>
    </section>
    <section style="position:relative;background:#FFFFFF;padding:14px 12px 10px;transform:rotate(1.2deg);box-shadow:0 3px 8px rgba(43,27,61,0.08);display:flex;flex-direction:column;gap:2px">
      <span style="position:absolute;right:12px;top:-9px;width:52px;height:18px;background:repeating-linear-gradient(-45deg,#6E9BFF 0 6px,#9BBBFF 6px 12px);opacity:0.85;transform:rotate(4deg)"></span>
      <span style="font-family:'Caveat',cursive;font-size:20px;font-weight:700;color:#2F57C9">metabolic</span>
      <span style="font-size:13px;font-weight:700;color:#6E5F7E">amrap-5-4-fungi</span>
      <span style="font-size:24px;font-weight:800;line-height:1.1">26 + 9</span>
      <span style="font-size:13px;font-weight:700;color:#6E5F7E;margin-top:4px">vs July</span>
      <span style="font-family:'Caveat',cursive;font-size:22px;font-weight:700;line-height:1.1;color:#2F57C9">+5 reps!</span>
    </section>
  </div>

  <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px">
    <legend style="font-family:'Caveat',cursive;font-size:22px;font-weight:700;padding:0;margin-bottom:6px">how was your energy?</legend>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center">
      <button aria-pressed="true" style="border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Caveat',cursive;font-size:19px;font-weight:700;color:#2B1B3D">
        <span class="sb-sticker" style="width:56px;height:56px;border-radius:28px;border:3px solid #FFFFFF;background:#FF6B3D;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg) scale(1.08)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2B1B3D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 9.5h.01M16 9.5h.01" stroke-width="3"></path><path d="M7 14c2.5 4 7.5 4 10 0"></path></svg></span>high!</button>
      <button aria-pressed="false" style="border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Caveat',cursive;font-size:19px;font-weight:700;color:#6E5F7E">
        <span style="width:50px;height:50px;border-radius:25px;background:#FFE7A8;display:flex;align-items:center;justify-content:center;opacity:0.85"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2B1B3D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 9.5h.01M16 9.5h.01" stroke-width="3"></path><path d="M8 15h8"></path></svg></span>okay</button>
      <button aria-pressed="false" style="border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Caveat',cursive;font-size:19px;font-weight:700;color:#6E5F7E">
        <span style="width:50px;height:50px;border-radius:25px;background:#D3E1FF;display:flex;align-items:center;justify-content:center;opacity:0.85"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2B1B3D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 10h3M14.5 10h3"></path><path d="M10 16c1.3-1 2.7-1 4 0"></path></svg></span>sleepy</button>
    </div>
  </fieldset>

  <div style="display:flex;flex-direction:column;gap:4px">
    <span style="font-family:'Caveat',cursive;font-size:22px;font-weight:700">how hard was it? <span style="color:#6E5F7E;font-size:18px">(1 easy · 5 brutal)</span></span>
    <div style="display:grid;grid-template-columns:86px repeat(5,minmax(0,1fr));align-items:center;height:42px">
      <span style="font-family:'Caveat',cursive;font-size:19px;font-weight:700;color:#C2410C">strength</span>
      <sc-for list="{{strength}}" as="d" hint-placeholder-count="5">
        <button aria-pressed="{{d.on}}" style="position:relative;border:0;background:transparent;height:42px;font-family:'Caveat',cursive;font-size:26px;font-weight:700;color:#2B1B3D">{{d.n}}
          <sc-if value="{{d.on}}" hint-placeholder-val="{{ false }}"><svg width="44" height="40" viewBox="0 0 70 66" aria-hidden="true" style="position:absolute;left:50%;top:50%;margin:-20px 0 0 -22px"><path class="sb-draw" d="M38 5C14 2 3 20 5 36s20 26 38 23 24-20 21-34S48 4 30 7" fill="none" stroke="#FF6B3D" stroke-width="5" stroke-linecap="round"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:86px repeat(5,minmax(0,1fr));align-items:center;height:42px">
      <span style="font-family:'Caveat',cursive;font-size:19px;font-weight:700;color:#2F57C9">metabolic</span>
      <sc-for list="{{metabolic}}" as="d" hint-placeholder-count="5">
        <button aria-pressed="{{d.on}}" style="position:relative;border:0;background:transparent;height:42px;font-family:'Caveat',cursive;font-size:26px;font-weight:700;color:#2B1B3D">{{d.n}}
          <sc-if value="{{d.on}}" hint-placeholder-val="{{ false }}"><svg width="44" height="40" viewBox="0 0 70 66" aria-hidden="true" style="position:absolute;left:50%;top:50%;margin:-20px 0 0 -22px"><path class="sb-draw" d="M38 5C14 2 3 20 5 36s20 26 38 23 24-20 21-34S48 4 30 7" fill="none" stroke="#6E9BFF" stroke-width="5" stroke-linecap="round"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>
  </div>

  <label style="display:flex;flex-direction:column;gap:0;flex-grow:1">
    <span style="font-family:'Caveat',cursive;font-size:22px;font-weight:700">dear diary…</span>
    <textarea style="flex-grow:1;min-height:34px;resize:none;border:0;background:repeating-linear-gradient(transparent 0 29px,#DCE6FF 29px 30px);font-family:'Caveat',cursive;font-size:21px;line-height:30px;color:#2B1B3D;padding:0;outline:none">knee felt great! last squat set was a grind but I got it</textarea>
  </label>

  <a href="SbJournal.dc.html" class="sb-go" style="text-decoration:none;height:56px;border-radius:22px 28px 24px 30px;background:#FF6B3D;color:#2B1B3D;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0">stick it in my journal</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { picked: 'star' }; }
renderVals() {
const row = (sel) => [1, 2, 3, 4, 5].map((n) => ({ n, on: n === sel }));
const opts = [
  { id: 'barbell', name: 'Barbell', bg: '#FF6B3D', rot: -8 },
  { id: 'kettle', name: 'Kettle', bg: '#FF9EC0', rot: 6 },
  { id: 'dumbbell', name: 'Dumbbell', bg: '#6E9BFF', rot: -4 },
  { id: 'bear', name: 'Squat bear', bg: '#3CC8A5', rot: 9 },
  { id: 'flame', name: 'Flame', bg: '#FFE7A8', rot: -6 },
  { id: 'star', name: 'PR star (rare)', bg: '#FFC94D', rot: 4, rare: true }
];
const picked = this.state.picked;
const stickers = opts.map((o) => {
  const on = o.id === picked;
  return { ...o, on, [o.id]: true, rot: (on ? o.rot * 2 : o.rot) + 'deg', size: on ? '58px' : '46px', op: on || !picked ? 1 : 0.75,
    pick: () => this.setState({ picked: o.id }) };
});
const cur = opts.find((o) => o.id === picked);
return { strength: row(4), metabolic: row(3), stickers, pickedLabel: cur ? cur.name.toLowerCase() + ' ✓' : 'tap one!' };
}
}
</script>
</body>
</html>
