<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journal (scrapbook)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes rise{from{opacity:0;transform:translateY(18px) rotate(var(--r))}to{opacity:1;transform:rotate(var(--r))}}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
.sb-rise{animation:rise .5s cubic-bezier(.2,1.2,.4,1) both}
.sb-draw{stroke-dasharray:400;animation:draw 1s ease-out .2s both}
.sb-sticker{filter:drop-shadow(0 2px 2px rgba(43,27,61,0.22))}
@media (prefers-reduced-motion: reduce){.sb-rise,.sb-draw{animation:none;stroke-dasharray:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background-color:#FFF8EE;background-image:radial-gradient(#E8D9C8 1.2px, transparent 1.2px);background-size:18px 18px;color:#2B1B3D;font-family:'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="position:absolute;left:30px;top:0;bottom:0;width:2px;background:#FFC4D6"></div>

  <div style="position:relative;flex-grow:1;display:flex;flex-direction:column;gap:12px;padding:50px 20px 8px 44px;overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div style="display:flex;flex-direction:column">
        <h1 style="margin:0;font-size:32px;font-weight:800;line-height:1.1">my journal</h1>
        <svg width="150" height="12" viewBox="0 0 160 12" aria-hidden="true"><path class="sb-draw" d="M2 8C28 2 50 11 78 6S132 2 158 7" fill="none" stroke="#FF6B3D" stroke-width="4" stroke-linecap="round"></path></svg>
      </div>
      <span style="font-family:'Caveat',cursive;font-size:19px;font-weight:700;color:#6E5F7E;text-align:right;line-height:1">376 workouts<br>since May '24</span>
    </div>

    <span style="font-family:'Caveat',cursive;font-size:26px;font-weight:700;color:#C2410C">October</span>
    <sc-for list="{{oct}}" as="e" hint-placeholder-count="2">
      <article class="sb-rise" style="--r:{{e.rot}};position:relative;background:#FFFFFF;padding:12px 12px 10px;box-shadow:0 3px 8px rgba(43,27,61,0.08);display:flex;gap:12px;animation-delay:{{e.delay}}">
        <span style="position:absolute;left:-8px;top:12px;width:16px;height:40px;background:{{e.tape}};opacity:0.85;transform:rotate(-6deg)"></span>
        <div style="width:42px;display:flex;flex-direction:column;align-items:center;flex-shrink:0">
          <span style="font-family:'Caveat',cursive;font-size:17px;font-weight:700;color:#6E5F7E">{{e.dow}}</span>
          <span style="font-size:26px;font-weight:800;line-height:1">{{e.day}}</span>
        </div>
        <div style="flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0">
          <span style="font-size:16px;font-weight:800">{{e.lift}} <span style="font-weight:600;color:#6E5F7E">· top {{e.top}}</span></span>
          <span style="font-size:13px;font-weight:600;color:#6E5F7E">{{e.met}}</span>
          <span style="font-family:'Caveat',cursive;font-size:19px;font-weight:600;line-height:1.1;color:#4A3B5A">{{e.note}}</span>
        </div>
        <span class="sb-sticker" style="position:absolute;right:-6px;top:-8px;width:40px;height:40px;border-radius:20px;background:{{e.stickerBg}};border:3px solid #FFFFFF;box-sizing:border-box;display:flex;align-items:center;justify-content:center;transform:rotate({{e.stickerRot}})">
          <svg width="24" height="13" viewBox="0 0 54 28" aria-hidden="true"><rect x="2" y="12" width="50" height="4" rx="2" fill="#2B1B3D"></rect><rect x="9" y="3" width="7" height="22" rx="3.5" fill="#FFF4E8"></rect><rect x="38" y="3" width="7" height="22" rx="3.5" fill="#FFF4E8"></rect></svg>
        </span>
        <sc-if value="{{e.pr}}" hint-placeholder-val="{{ false }}">
          <span class="sb-sticker" style="position:absolute;right:30px;top:-10px;height:26px;padding:0 8px;border-radius:13px;background:#FFC94D;border:2.5px solid #FFFFFF;box-sizing:border-box;display:flex;align-items:center;font-size:11px;font-weight:800;transform:rotate(8deg)">PR!</span>
        </sc-if>
      </article>
    </sc-for>

    <span style="font-family:'Caveat',cursive;font-size:26px;font-weight:700;color:#C2410C">September</span>
    <sc-for list="{{sep}}" as="e" hint-placeholder-count="2">
      <article class="sb-rise" style="--r:{{e.rot}};position:relative;background:#FFFFFF;padding:12px 12px 10px;box-shadow:0 3px 8px rgba(43,27,61,0.08);display:flex;gap:12px;animation-delay:{{e.delay}}">
        <span style="position:absolute;left:-8px;top:12px;width:16px;height:40px;background:{{e.tape}};opacity:0.85;transform:rotate(-6deg)"></span>
        <div style="width:42px;display:flex;flex-direction:column;align-items:center;flex-shrink:0">
          <span style="font-family:'Caveat',cursive;font-size:17px;font-weight:700;color:#6E5F7E">{{e.dow}}</span>
          <span style="font-size:26px;font-weight:800;line-height:1">{{e.day}}</span>
        </div>
        <div style="flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0">
          <span style="font-size:16px;font-weight:800">{{e.lift}} <span style="font-weight:600;color:#6E5F7E">· top {{e.top}}</span></span>
          <span style="font-size:13px;font-weight:600;color:#6E5F7E">{{e.met}}</span>
          <span style="font-family:'Caveat',cursive;font-size:19px;font-weight:600;line-height:1.1;color:#4A3B5A">{{e.note}}</span>
        </div>
        <span class="sb-sticker" style="position:absolute;right:-6px;top:-8px;width:40px;height:40px;border-radius:20px;background:{{e.stickerBg}};border:3px solid #FFFFFF;box-sizing:border-box;display:flex;align-items:center;justify-content:center;transform:rotate({{e.stickerRot}})">
          <svg width="24" height="13" viewBox="0 0 54 28" aria-hidden="true"><rect x="2" y="12" width="50" height="4" rx="2" fill="#2B1B3D"></rect><rect x="9" y="3" width="7" height="22" rx="3.5" fill="#FFF4E8"></rect><rect x="38" y="3" width="7" height="22" rx="3.5" fill="#FFF4E8"></rect></svg>
        </span>
      </article>
    </sc-for>
  </div>

  <nav style="position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 8px 26px;background:#FFF8EE;border-top:2px dashed #E8D9C8;font-family:'Caveat',cursive;font-size:20px;font-weight:700;color:#6E5F7E">
    <a href="Scrapbook.dc.html" style="text-decoration:none;color:#6E5F7E;text-align:center">Today</a>
    <a href="SbJournal.dc.html" style="text-decoration:none;color:#E5532A;text-align:center">Journal</a>
    <a href="SbProgress.dc.html" style="text-decoration:none;color:#6E5F7E;text-align:center">Progress</a>
    <a href="Scrapbook.dc.html" style="text-decoration:none;color:#6E5F7E;text-align:center">Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tape = { high: '#FF6B3D', ok: '#FFC94D', low: '#6E9BFF' };
const mk = (list, offset) => list.map((e, i) => ({
  ...e, tape: tape[e.energy], rot: (i % 2 ? 0.8 : -0.8) + 'deg',
  stickerBg: e.energy === 'low' ? '#6E9BFF' : e.energy === 'ok' ? '#FF9EC0' : '#FF6B3D',
  stickerRot: (i % 2 ? 10 : -8) + 'deg', delay: (0.08 * (i + offset) + 0.2).toFixed(2) + 's'
}));
const oct = mk([
  { dow: 'mon', day: 5, lift: 'Front Squat', top: '125', met: 'amrap-5-4-fungi · 26 + 9', note: 'knee felt great!', energy: 'high', pr: true },
  { dow: 'fri', day: 2, lift: 'Deadlift', top: '185', met: 'bench jumps · 3+3, 3+3, 2+20, 2+21', note: 'grip gave out before legs did', energy: 'ok', pr: false }
], 0);
const sep = mk([
  { dow: 'wed', day: 30, lift: 'Push Press', top: '100', met: 'australian pull-ups · 4+5, 4, 4+4, 4+5', note: 'shoulders a bit tired', energy: 'low' },
  { dow: 'mon', day: 28, lift: 'Back Squat', top: '135', met: 'wall walks · 4+1, 4+5, 4+6, 4+5', note: 'back to where I was in June', energy: 'high' },
  { dow: 'fri', day: 25, lift: 'Power Clean', top: '100', met: 'for time · 13:51', note: 'fast elbows!', energy: 'ok' }
], 2);
return { oct, sep };
}
}
</script>
</body>
</html>
