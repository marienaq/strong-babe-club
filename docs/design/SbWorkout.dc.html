<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout: strength (scrapbook)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes slap{0%{opacity:0;transform:scale(1.7) rotate(var(--r))}60%{opacity:1;transform:scale(0.92) rotate(var(--r))}100%{opacity:1;transform:scale(1) rotate(var(--r))}}
@keyframes tick{from{stroke-dashoffset:0}to{stroke-dashoffset:-276}}
.sb-slap{animation:slap .45s cubic-bezier(.2,1.2,.4,1) both}
.sb-sticker{filter:drop-shadow(0 2px 2px rgba(43,27,61,0.22))}
@media (prefers-reduced-motion: reduce){.sb-slap{animation:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background-color:#FFF8EE;background-image:radial-gradient(#E8D9C8 1.2px, transparent 1.2px);background-size:18px 18px;color:#2B1B3D;font-family:'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="position:absolute;left:30px;top:0;bottom:0;width:2px;background:#FFC4D6"></div>

  <header style="position:relative;padding:48px 20px 6px 44px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-family:'Caveat',cursive;font-size:21px;font-weight:600;color:#6E5F7E">Mon, Oct 5 · front squat day</span>
      <span style="font-size:14px;font-weight:800;color:#6E5F7E;font-variant-numeric:tabular-nums">18:40</span>
    </div>
    <nav aria-label="Workout sections" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-family:'Caveat',cursive;font-size:18px;font-weight:700">
      <a href="SbWorkout.dc.html" style="text-decoration:none;color:#2B1B3D;background:#FFC94D;opacity:0.55;height:30px;display:flex;align-items:center;justify-content:center;transform:rotate(-1deg)">warm-up ✓</a>
      <a href="SbWorkout.dc.html" aria-current="step" style="text-decoration:none;color:#2B1B3D;background:#FF6B3D;height:34px;margin-top:-2px;display:flex;align-items:center;justify-content:center;transform:rotate(1.5deg);box-shadow:0 2px 4px rgba(43,27,61,0.2)">strength</a>
      <a href="SbMetabolic.dc.html" style="text-decoration:none;color:#2B1B3D;background:#C9D9FF;height:30px;display:flex;align-items:center;justify-content:center;transform:rotate(-1.5deg)">metabolic</a>
      <a href="SbMetabolic.dc.html" style="text-decoration:none;color:#2B1B3D;background:#BDEEDF;height:30px;display:flex;align-items:center;justify-content:center;transform:rotate(1deg)">cool-down</a>
    </nav>
  </header>

  <div style="position:relative;flex-grow:1;display:flex;flex-direction:column;gap:12px;padding:8px 20px 8px 44px">
    <section style="position:relative;background:#FFFFFF;padding:14px 14px 12px;transform:rotate(-0.8deg);box-shadow:0 3px 8px rgba(43,27,61,0.08);display:flex;gap:8px;align-items:center">
      <span style="position:absolute;left:18px;top:-9px;width:64px;height:18px;background:repeating-linear-gradient(45deg,#FF6B3D 0 6px,#FF8D66 6px 12px);opacity:0.8;transform:rotate(-4deg)"></span>
      <div style="flex-grow:1;display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'Caveat',cursive;font-size:20px;font-weight:700;color:#C2410C">strength</span>
        <span style="font-size:26px;font-weight:800;line-height:1.05">Front Squat</span>
        <span style="font-size:14px;font-weight:600;line-height:1.35">Every 2 min for 12 min<br>5 reps · go up each set</span>
      </div>
      <svg width="86" height="86" viewBox="0 0 120 120" role="img" aria-label="Bear demonstrating a front squat" style="flex-shrink:0">
        <line x1="60" y1="108" x2="70" y2="108" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round"></line>
        <line x1="60" y1="108" x2="60" y2="88" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round">
          <animate attributeName="x2" values="60;72;72;60;60" keyTimes="0;0.4;0.5;0.9;1" dur="2.6s" repeatCount="indefinite"></animate>
          <animate attributeName="y2" values="88;92;92;88;88" keyTimes="0;0.4;0.5;0.9;1" dur="2.6s" repeatCount="indefinite"></animate>
        </line>
        <line x1="58" y1="68" x2="60" y2="88" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round">
          <animate attributeName="x1" values="58;52;52;58;58" keyTimes="0;0.4;0.5;0.9;1" dur="2.6s" repeatCount="indefinite"></animate>
          <animate attributeName="y1" values="68;90;90;68;68" keyTimes="0;0.4;0.5;0.9;1" dur="2.6s" repeatCount="indefinite"></animate>
          <animate attributeName="x2" values="60;72;72;60;60" keyTimes="0;0.4;0.5;0.9;1" dur="2.6s" repeatCount="indefinite"></animate>
          <animate attributeName="y2" values="88;92;92;88;88" keyTimes="0;0.4;0.5;0.9;1" dur="2.6s" repeatCount="indefinite"></animate>
        </line>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;-6 22;-6 22;0 0;0 0" keyTimes="0;0.4;0.5;0.9;1" dur="2.6s" repeatCount="indefinite"></animateTransform>
          <ellipse cx="57" cy="55" rx="11" ry="15" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="3"></ellipse>
          <circle cx="53" cy="17" r="4.5" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"></circle>
          <circle cx="66" cy="17" r="4.5" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"></circle>
          <circle cx="60" cy="27" r="11" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="3"></circle>
          <ellipse cx="70" cy="30" rx="5" ry="3.6" fill="#FFFFFF" stroke="#2B1B3D" stroke-width="2.5"></ellipse>
          <circle cx="74" cy="29" r="1.6" fill="#2B1B3D"></circle><circle cx="64" cy="24" r="1.6" fill="#2B1B3D"></circle>
          <path d="M60 44l12 6-3-11" fill="none" stroke="#2B1B3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="70" cy="40" r="10" fill="#FF6B3D" stroke="#2B1B3D" stroke-width="2.5"></circle>
          <circle cx="70" cy="40" r="2.5" fill="#2B1B3D"></circle>
        </g>
      </svg>
    </section>

    <div style="display:flex;align-items:center;gap:14px;padding:0 4px">
      <svg width="78" height="78" viewBox="0 0 100 100" role="img" aria-label="48 seconds until set 4" style="flex-shrink:0">
        <path d="M50 8C27 7 8 26 9 50s20 42 42 41 40-19 40-42S73 9 47 10" fill="none" stroke="#E8D9C8" stroke-width="9" stroke-linecap="round"></path>
        <path d="M50 8C27 7 8 26 9 50s20 42 42 41" fill="none" stroke="#FF6B3D" stroke-width="9" stroke-linecap="round"></path>
        <text x="50" y="57" text-anchor="middle" font-family="Nunito, sans-serif" font-size="22" font-weight="800" fill="#2B1B3D">0:48</text>
      </svg>
      <div style="flex-grow:1;display:flex;flex-direction:column">
        <span style="font-family:'Caveat',cursive;font-size:22px;font-weight:700;line-height:1">set 4 starts soon</span>
        <span style="font-size:13px;font-weight:600;color:#6E5F7E">105 lb = bar + 25 + 5 each side</span>
      </div>
      <button aria-label="Pause timer" class="sb-sticker" style="width:48px;height:48px;border-radius:24px;border:3px solid #FFFFFF;background:#2B1B3D;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg)"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFF4E8" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"></rect><rect x="14" y="4" width="5" height="16" rx="1.5"></rect></svg></button>
    </div>

    <section style="position:relative;background:#FFFFFF;padding:10px 12px 6px;box-shadow:0 3px 8px rgba(43,27,61,0.08);background-image:repeating-linear-gradient(#FFFFFF 0 43px,#DCE6FF 43px 44px);display:flex;flex-direction:column">
      <div style="display:grid;grid-template-columns:34px 40px 1fr 74px 44px;gap:6px;font-family:'Caveat',cursive;font-size:17px;font-weight:700;color:#6E5F7E;height:24px;align-items:center">
        <span>set</span><span>reps</span><span>last time</span><span style="text-align:center">lb</span><span></span>
      </div>
      <sc-for list="{{sets}}" as="s" hint-placeholder-count="6">
        <div style="display:grid;grid-template-columns:34px 40px 1fr 74px 44px;gap:6px;align-items:center;height:44px">
          <span style="font-family:'Caveat',cursive;font-size:24px;font-weight:700;text-align:center;color:{{s.numColor}}">{{s.n}}</span>
          <span style="font-weight:700;color:#6E5F7E">×5</span>
          <span style="font-family:'Caveat',cursive;font-size:19px;color:#9A8FA8">{{s.last}}</span>
          <sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}">
            <span style="font-family:'Caveat',cursive;font-size:27px;font-weight:700;text-align:center;line-height:1">{{s.w}}</span>
          </sc-if>
          <sc-if value="{{s.open}}" hint-placeholder-val="{{ false }}">
            <label style="display:block"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Weight for set {{s.n}}</span><input placeholder="{{s.w}}" style="width:100%;box-sizing:border-box;height:36px;border:0;border-bottom:2.5px solid {{s.lineColor}};background:transparent;color:#2B1B3D;text-align:center;font-family:'Caveat',cursive;font-size:26px;font-weight:700;outline:none"></label>
          </sc-if>
          <sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}">
            <button aria-label="Set {{s.n}} done" class="sb-slap sb-sticker" style="--r:{{s.rot}};width:38px;height:38px;border-radius:19px;border:3px solid #FFFFFF;background:#FF6B3D;display:flex;align-items:center;justify-content:center;animation-delay:{{s.delay}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B1B3D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></button>
          </sc-if>
          <sc-if value="{{s.open}}" hint-placeholder-val="{{ false }}">
            <button aria-label="Mark set {{s.n}} done" style="width:36px;height:36px;border:0;background:transparent;padding:0"><svg width="32" height="32" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 4c5-1 11 0 16-1 1 5 0 11 1 16-5 1-11 0-16 1-1-5 0-11-1-16z" fill="none" stroke="#2B1B3D" stroke-width="1.8" stroke-linejoin="round"></path></svg></button>
          </sc-if>
        </div>
      </sc-for>
      <span style="position:absolute;right:-10px;bottom:20px;font-family:'Caveat',cursive;font-size:18px;font-weight:700;color:#B3265E;transform:rotate(-8deg)">← PR if you hit it!</span>
    </section>

    <label style="display:flex;flex-direction:column;gap:2px">
      <span style="font-family:'Caveat',cursive;font-size:20px;font-weight:700">notes to self</span>
      <input placeholder="knee felt good today…" style="height:34px;border:0;border-bottom:2px dashed #C9B8A6;background:transparent;font-family:'Caveat',cursive;font-size:21px;color:#2B1B3D;outline:none">
    </label>
  </div>

  <div style="position:relative;padding:10px 20px 30px 44px;display:flex;gap:10px">
    <a href="SbMetabolic.dc.html" style="text-decoration:none;flex-grow:1;height:52px;border-radius:20px 24px 22px 26px;background:#FFFFFF;box-shadow:0 3px 8px rgba(43,27,61,0.1);color:#2B1B3D;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center">next: metabolic →</a>
    <a href="SbFinish.dc.html" style="text-decoration:none;width:110px;height:52px;border-radius:22px 28px 24px 30px;background:#FF6B3D;color:#2B1B3D;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center">finish</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
  { w: 65, last: 55, done: true }, { w: 80, last: 75, done: true }, { w: 95, last: 90, done: true },
  { w: 105, last: 105, current: true }, { w: 115, last: 120 }, { w: 125, last: '–' }
];
const rots = [-8, 6, -4];
const sets = rows.map((r, i) => ({
  n: i + 1, w: r.w, last: r.last, done: !!r.done, open: !r.done,
  numColor: r.done ? '#2B1B3D' : '#9A8FA8',
  lineColor: r.current ? '#FF6B3D' : '#D9CCBD',
  rot: (rots[i] ?? 0) + 'deg', delay: (0.15 * i + 0.2).toFixed(2) + 's'
}));
return { sets };
}
}
</script>
</body>
</html>
